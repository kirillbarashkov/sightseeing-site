<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sightseeing | Vercel Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Geist', system-ui, -apple-system, sans-serif; color: #171717; background-color: #ffffff; -webkit-font-smoothing: antialiased; }
        .vercel-card { background: #ffffff; box-shadow: rgba(0,0,0,0.08) 0px 0px 0px 1px, rgba(0,0,0,0.04) 0px 2px 2px, #fafafa 0px 0px 0px 1px; transition: all 0.2s ease; }
        .vercel-card:hover { box-shadow: rgba(0,0,0,0.12) 0px 0px 0px 1px, rgba(0,0,0,0.08) 0px 4px 4px; }
        .title-compressed { letter-spacing: -0.96px; font-weight: 600; }
        .pill-badge { background-color: #ebf5ff; color: #0068d6; font-size: 12px; font-weight: 500; border-radius: 9999px; }
        .modal-backdrop { background-color: hsla(0, 0%, 98%, 1); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="py-16 px-4">
    <div class="max-w-4xl mx-auto">
        <header class="mb-20 text-center">
            <h1 class="text-5xl font-semibold mb-4" style="letter-spacing: -2.4px; font-weight: 600;">🗺️ Классные места</h1>
            <p class="text-slate-500 text-lg">Курируемый список направлений для будущих путешествий</p>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="cards-container"></div>
    </div>
    <div id="modal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-8 relative shadow-2xl" style="box-shadow: rgba(0,0,0,0.1) 0px 20px 25px -5px, rgba(0,0,0,0.1) 0px 8px 10px -6px;">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            <div id="modal-content" class="prose prose-slate max-w-none"></div>
        </div>
    </div>
    <script>
        const data = {
            'Сахалин': 'Поездка на Сахалин через туроператора Kuril Tour.',
            'Курилы': 'Исследование Курильских островов.',
            'Калининград': 'Нужно подобрать варианты маршрутов.',
            'Суздаль': 'Фестиваль воздухоплавания «Золотая осень на Золотом кольце». Планируем на следующий год.',
            'Мурманск': 'Купание с китами и северное сияние. Поиск вариантов.'
        };
        const places = [
            {id: 'Сахалин', title: 'Сахалин', cat: 'Природа', loc: 'Россия', prio: 'Must visit', body: data['Сахалин']},
            {id: 'Курилы', title: 'Курилы', cat: 'Природа', loc: 'Россия', prio: 'Must visit', body: data['Курилы']},
            {id: 'Калининград', title: 'Калининград', cat: 'Город', loc: 'Россия', prio: 'Nice to have', body: data['Калининград']},
            {id: 'Суздаль', title: 'Суздаль', cat: 'Событие', loc: 'Россия', prio: 'Nice to have', body: data['Суздаль']},
            {id: 'Мурманск', title: 'Мурманск', cat: 'Природа', loc: 'Россия', prio: 'Must visit', body: data['Мурманск']}
        ];
        const container = document.getElementById('cards-container');
        places.forEach(p => {
            container.innerHTML += `<div class="vercel-card p-6 rounded-lg cursor-pointer" onclick="showPlace('${p.id}')"><div class="flex justify-between items-start mb-3"><h2 class="text-xl title-compressed">${p.title}</h2><span class="pill-badge px-2 py-0.5">${p.cat}</span></div><p class="text-slate-500 text-sm line-clamp-2 mb-4">${p.body}...</p><div class="flex gap-3 text-[11px] font-medium text-slate-400 uppercase tracking-wider"><span>📍 ${p.loc}</span><span>⭐ ${p.prio}</span></div></div>`;
        });
        function showPlace(id){
            const content = data[id] || 'Нет данных';
            document.getElementById('modal-content').innerHTML = marked.parse(content);
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
        document.addEventListener('keydown', (e) => { if(e.key==='Escape') closeModal(); });
    </script>
</body>
</html>
